name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets codecov-action authenticate via OIDC instead of a stored token
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'

      - name: Vet
        run: go vet ./...

      - name: Vet (windows)
        run: go vet ./...
        env:
          GOOS: windows

      - name: Staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          install-go: false

      - name: Test
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.out
          use_oidc: true
